        <h2> course registration form</h2>
         
        <form> 
            <label for="name"> Student Name:</label> <br
>            <input type="text" id="name" name="name" required><br><br>

            <label for="email"> Student Email:</label> <br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="mobile"> Mobile Number:</label> <br>
            <input type="tel" id="mobie" name="mobile" required><br><br>
            

            <label for="dob"> Date of Birth:</label> <br>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="gender"> Gender:</label> <br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male"> Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female"> Female</label><br><br>

            <label for="course">Select Course:</label> <br>
            <select name="course" id="course" name="course">
                <option value="java"> Java</option>
                <option value="python"> Python</option>
                <option value="data science"> Data Science</option>
                <option value="data analytics"> Data Analytics</option>
            </select> <br><br>

            <label> Learning Mode</label> <br>
            <input type="radio" id="online" name="learning mode" value="online">
            <label for="online"> Online</label>
             <input type="radio" id="offline" name="learning mode" value="offline">
            <label for="offline"> Offline</label><br><br>

            <label> Skills:</label> <br>
            <input type="checkbox" id="java" name="skills" value="java">
            <label for="java"> Java</label>
            <input type="checkbox" id="MS office" name="skills" value="ms offic">
            <label for="MS office"> MS Office</label>
            <input type="checkbox" id="DS" name="skills" value="DS">
            <label for="DS"> Data Science</label>
            <input type="checkbox" id="Python" name="skills" value="Python">
            <label for="Python"> Python</label><br><br>
             
            <label for="start date"> Start Date:</label> <br>
            <input type="date" id="start date" name="start date"><br><br>

            <label for="photo"> Upload Photo:</label> <br>
            <input type="file" id="photo" name="photo"><br><br>
             
            <label for="address"> Address:</label> <br>
            <textarea id="address" name="address" rows="4" cols="50"> </textarea><br><br>

            <label for="country"> Country:</label> <br> 
            <select name="country" id="country">
                <option value="india"> India</option>
                <option value="USA"> USA</option>
                <option value="UK"> UK</option>
                <option value="Australia"> Australia</option><br><br>  
                
                <label for="username"> Username:</label> <br>
                <input type="text" id="username" name="username"><br><br>

                <label for="password"> Password:</label> <br>
                <input type="password" id="password" name="password"><br><br>
                 
                <label for="confirmation password"> Confirmation Password:</label> <br>
                <input type="password" id="confirmation password" name="confirmation password"><br><br>

                <input type="checkbox" id="terms and conditions" name="terms and conditions" value="agree">
                <label for="terms and conditions"> I agree to the terms and conditions</label><br><br>

                <input type="submit" value="Submit">
                <input type="reset" value="Reset"><br><br>


            </form>
